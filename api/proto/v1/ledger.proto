syntax = "proto3";

package rgb.ledger.v1;

option go_package = "./pkg/pb";

service LedgerService {
  rpc GetBalance (GetBalanceRequest) returns (BalanceResponse) {}

  rpc SubmitTransaction (SubmitTransactionRequest) returns (SubmitTransactionResponse) {}

  // RegisterAuthority adds a new minting authority to the open authority set.
  // The caller must prove ownership of the keypair by signing their own public key.
  rpc RegisterAuthority (RegisterAuthorityRequest) returns (RegisterAuthorityResponse) {}

  // GetTransactionHistory returns paginated transaction history for a player.
  rpc GetTransactionHistory (GetTransactionHistoryRequest) returns (TransactionHistoryResponse) {}

  // GetChainStats returns aggregate chain and network statistics.
  rpc GetChainStats (GetChainStatsRequest) returns (ChainStatsResponse) {}

  // GetBlock returns the block at the given height, including its transaction hashes.
  rpc GetBlock (GetBlockRequest) returns (BlockResponse) {}

  // ListBlocks returns a paginated list of block headers.
  rpc ListBlocks (ListBlocksRequest) returns (ListBlocksResponse) {}

  // GetLeaderboard returns the top-N players sorted by the requested channel.
  rpc GetLeaderboard (GetLeaderboardRequest) returns (LeaderboardResponse) {}
}

// =============================================================================
// Message Definitions
// =============================================================================

message GetBalanceRequest {
  string player_id = 1;
}

message BalanceResponse {
  string player_id = 1;
  uint32 red = 2;
  uint32 green = 3;
  uint32 blue = 4;

  // The client needs this to sign the NEXT transaction correctly
  uint64 next_nonce = 5;
}

message SubmitTransactionRequest {
  // Step 1: Client Marshals 'TransactionPayload' into bytes.
  // Step 2: Client Signs those bytes.
  // Step 3: Client sends bytes + signature here.
  bytes raw_payload = 1;

  // The cryptographic signature of raw_payload
  bytes signature = 2;

  // The Public Key used to verify the signature.
  // The Server must check: Hash(sender_pub_key) == raw_payload.sender_id
  bytes sender_pub_key = 3;
}

message TransactionPayload {
  // Enum to differentiate between a player transfer and a system reward
  enum TxType {
    TRANSFER = 0; // Standard peer-to-peer
    MINT = 1;     // Mission Reward (Requires Authority Key)
  }
  TxType type = 1;

  string sender_id = 2;
  string receiver_id = 3;

  uint32 amount_red = 4;
  uint32 amount_green = 5;
  uint32 amount_blue = 6;

  uint64 nonce = 7;
}

message SubmitTransactionResponse {
  bool success = 1;

  string error_message = 2;

  string tx_hash = 3;

  BalanceResponse new_balance = 4;
}

// RegisterAuthorityRequest proves ownership of a keypair by signing the public key itself.
message RegisterAuthorityRequest {
  // The raw ed25519 public key of the authority to register.
  bytes pub_key = 1;

  // ed25519 signature of pub_key bytes — proves the caller holds the private key.
  bytes signature = 2;
}

message RegisterAuthorityResponse {
  bool success = 1;
  string error_message = 2;
  // The authority ID derived from the registered key: hex(sha256(pub_key)).
  string authority_id = 3;
}

// =============================================================================
// Transaction History
// =============================================================================

message GetTransactionHistoryRequest {
  string player_id = 1;
  uint32 limit = 2;  // max 100; 0 defaults to 20
  uint32 offset = 3;
}

message TransactionEntry {
  string hash = 1;
  uint32 type = 2;       // 0=TRANSFER, 1=MINT
  string sender_id = 3;
  string receiver_id = 4;
  uint32 red = 5;
  uint32 green = 6;
  uint32 blue = 7;
  uint64 nonce = 8;
  int64 timestamp = 9;
  sint64 block_height = 10; // -1 when pending (not yet sealed)
}

message TransactionHistoryResponse {
  repeated TransactionEntry transactions = 1;
  uint64 total = 2;
}

// =============================================================================
// Chain Stats
// =============================================================================

message GetChainStatsRequest {}

message ChainStatsResponse {
  uint64 chain_height = 1;
  uint64 pending_tx_count = 2;
  uint64 total_tx_count = 3;
  string last_block_hash = 4;
  int64 last_block_timestamp = 5;
  uint64 total_players = 6;
}

// =============================================================================
// Block Explorer
// =============================================================================

message GetBlockRequest {
  uint64 height = 1;
}

message BlockInfo {
  uint64 height = 1;
  string hash = 2;
  string prev_hash = 3;
  string merkle_root = 4;
  int64 timestamp = 5;
  uint64 nonce = 6;
  uint32 difficulty = 7;
  repeated string tx_hashes = 8;
}

message BlockResponse {
  bool found = 1;
  BlockInfo block = 2;
}

message ListBlocksRequest {
  uint32 page = 1;       // 0-indexed
  uint32 page_size = 2;  // max 50; 0 defaults to 10
}

message ListBlocksResponse {
  repeated BlockInfo blocks = 1;
  uint64 total_blocks = 2;
}

// =============================================================================
// Leaderboard
// =============================================================================

message GetLeaderboardRequest {
  uint32 top_n = 1;    // max 100; 0 defaults to 10
  string sort_by = 2;  // "RED", "GREEN", "BLUE", "TOTAL" (default: "TOTAL")
}

message LeaderboardEntry {
  uint32 rank = 1;
  string player_id = 2;
  uint32 red = 3;
  uint32 green = 4;
  uint32 blue = 5;
  uint32 total = 6;
}

message LeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}
